        price: {type: integer}
        currency: {type: string}
        duration_minutes: {type: integer, nullable: true}
        rate_limit: {type: string, nullable: true}
        device_limit: {type: integer}
        data_limit_mb: {type: integer, nullable: true}
        is_vip: {type: boolean}
        valid_until: {type: string, format: date-time, nullable: true}
        sold_at: {type: string, format: date-time, nullable: true}
