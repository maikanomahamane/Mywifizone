      allOf:
        - $ref: '#/components/schemas/Router'
        - type: object
          properties:
            enrollment:
              type: object
              properties:
                code: {type: string, example: WZ-ABCDE-FGHJK-MNPQR-STUVW, description: 'Affiché une seule fois ; valable 24 h ; usage unique.'}
                expires_at: {type: string, format: date-time}
    RouterInput:
      type: object
      required: [site_id, name]
      properties:
        site_id: {type: string, format: uuid}
        name: {type: string, maxLength: 120}
        model: {type: string, maxLength: 80, nullable: true}
        hotspot_server: {type: string, pattern: '^[A-Za-z0-9._-]{1,60}$'}
        connection_mode: {type: string, enum: [AGENT, REST], default: AGENT}
        host: {type: string, maxLength: 253, description: 'REST : IPv4 ou nom de domaine publics (pas de http://, pas de port).'}
        port: {type: integer, minimum: 1, maximum: 65535, default: 443}
        username: {type: string, maxLength: 64, description: 'REST : identifiant ADMIN du MikroTik (utilisé une seule fois).'}
        password: {type: string, maxLength: 255, format: password, writeOnly: true, description: 'REST : mot de passe admin, jamais stocké ni journalisé. Le serveur crée un compte dédié `wifizone` aux droits limités et ne conserve que celui-ci (chiffré).'}
        verify_tls: {type: boolean, default: false, description: 'Vérifier le certificat HTTPS du routeur (faux pour un certificat auto-signé).'}
    RouterUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 120}
        model: {type: string, maxLength: 80, nullable: true}
