        max_access_points: {type: integer, minimum: 0, nullable: true}
        max_agents: {type: integer, minimum: 0, nullable: true}
        max_batch_size: {type: integer, minimum: 0, nullable: true, description: 'Taille maximale d''un lot de vouchers.'}
    Plan:
      type: object
      properties:
        code: {type: string, example: STARTER}
        name: {type: string}
        currency: {type: string, example: XOF}
