        yearly_price: {type: integer, nullable: true}
        trial_days: {type: integer, example: 14}
        limits: {$ref: '#/components/schemas/PlanLimits'}
        features: {type: array, items: {type: string}}
    PlanAdmin:
      allOf:
        - $ref: '#/components/schemas/Plan'
