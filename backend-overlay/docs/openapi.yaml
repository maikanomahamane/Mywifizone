        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccessPointInput'}
      responses:
        '201': {description: Créé, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AccessPoint'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /access-points/{id}:
    parameters:
