        opened_by: {type: string, format: uuid}
        closed_by: {type: string, format: uuid, nullable: true}
        opening_balance: {type: integer}
        current_balance: {type: integer, nullable: true, description: 'Session ouverte uniquement'}
        expected_balance: {type: integer, nullable: true}
        counted_balance: {type: integer, nullable: true}
        difference: {type: integer, nullable: true, description: 'compté - attendu'}
        opened_at: {type: string, format: date-time}
        closed_at: {type: string, format: date-time, nullable: true}
        note: {type: string, nullable: true}
    CashTransaction:
      type: object
      properties:
        id: {type: string, format: uuid}
        cash_session_id: {type: string, format: uuid}
        type: {type: string, enum: [OPEN, CASH_IN, SALE, EXPENSE, WITHDRAWAL, ADJUSTMENT, CLOSE]}
        amount: {type: integer, description: 'Signé : + entrée, - sortie'}
        currency: {type: string}
        sale_id: {type: string, format: uuid, nullable: true}
        user_id: {type: string, format: uuid, nullable: true}
        note: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    SalesReport:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              period_start: {type: string, format: date}
              currency: {type: string}
              group: {type: string, nullable: true, description: 'Valeur de la dimension demandée (site, agent, profil ou moyen de paiement)'}
              sales_count: {type: integer}
              total: {type: integer}
        totals:
          type: array
          items:
            type: object
            properties:
              currency: {type: string}
              sales_count: {type: integer}
              total: {type: integer}
    Dashboard:
      type: object
      properties:
        date: {type: string, format: date, description: 'Jour local du tenant'}
        network:
          type: object
          properties:
            routers_online: {type: integer}
            routers_offline: {type: integer}
            routers_pending: {type: integer}
            connected_clients: {type: integer}
        tickets:
          type: object
          properties:
            active: {type: integer}
            available: {type: integer}
            sold: {type: integer}
        revenue_today:
          type: array
          items:
            type: object
            properties:
              currency: {type: string}
              sales_count: {type: integer}
              total: {type: integer}
        cash_session:
          allOf: [{$ref: '#/components/schemas/CashSession'}]
          nullable: true
    StaffMember:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        locale: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        last_login_at: {type: string, format: date-time, nullable: true}
