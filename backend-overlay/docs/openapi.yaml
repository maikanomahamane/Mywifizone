        device_limit: {type: integer, minimum: 1, maximum: 20}
        data_limit_mb: {type: integer, minimum: 1, nullable: true}
        is_active: {type: boolean}
        portal_visible: {type: boolean, description: 'Proposé à l''achat direct du portail captif (profils STANDARD payants uniquement).'}
    HotspotProfileUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 80}
        kind: {type: string, enum: [STANDARD, VIP]}
        price: {type: integer, minimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3}
        duration_minutes: {type: integer, minimum: 1, nullable: true}
        rate_limit: {type: string, nullable: true}
        device_limit: {type: integer, minimum: 1, maximum: 20}
        data_limit_mb: {type: integer, minimum: 1, nullable: true}
        is_active: {type: boolean}
        portal_visible: {type: boolean, description: 'Proposé à l''achat direct du portail captif (profils STANDARD payants uniquement).'}
    VoucherBatchInput:
