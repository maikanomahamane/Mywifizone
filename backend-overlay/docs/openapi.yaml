      responses:
        '200': {description: Lots, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/VoucherBatch'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Tickets]
      summary: 'Génère un lot de vouchers (202 : utilisables après confirmation du routeur)'
      description: 'Taille maximale selon la formule (`max_batch_size`). Routeur non enrôlé : `router_not_enrolled` (409).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VoucherBatchInput'}
      responses:
        '202': {description: Lot en cours de synchronisation, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/VoucherBatch'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: 'Conflit (`router_not_enrolled`, `profile_in_use`, `voucher_not_revocable`, `connector_unavailable`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}

  /voucher-batches/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Tickets]
      summary: 'Détail d''un lot avec le décompte par statut'
      responses:
        '200': {description: Lot, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/VoucherBatch'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /vouchers:
    get:
      tags: [Tickets]
      summary: 'Liste des vouchers'
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [GENERATED, AVAILABLE, SOLD, ACTIVE, USED, EXPIRED, REVOKED, VIP]}}
        - {name: sync_status, in: query, schema: {type: string, enum: [PENDING, SYNCED, FAILED]}}
        - {name: router_id, in: query, schema: {type: string, format: uuid}}
        - {name: site_id, in: query, schema: {type: string, format: uuid}}
        - {name: batch_id, in: query, schema: {type: string, format: uuid}}
        - {name: profile_id, in: query, schema: {type: string, format: uuid}}
        - {name: is_vip, in: query, schema: {type: boolean}}
        - {name: q, in: query, description: Préfixe du code, schema: {type: string, maxLength: 12}}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Vouchers, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Voucher'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /vouchers/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Tickets]
      summary: 'Détail d''un voucher'
      responses:
        '200': {description: Voucher, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Voucher'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /vouchers/{id}/revoke:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Tickets]
      summary: 'Révoque un voucher (idempotent ; refusé s''il est déjà épuisé/expiré : `voucher_not_revocable`)'
      responses:
        '200': {description: Voucher révoqué, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Voucher'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Conflit (`router_not_enrolled`, `profile_in_use`, `voucher_not_revocable`, `connector_unavailable`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}

  /sessions:
    get:
      tags: [Réseau]
      summary: 'Sessions HotSpot (actives par défaut)'
      parameters:
        - {name: router_id, in: query, schema: {type: string, format: uuid}}
        - {name: active, in: query, schema: {type: boolean, default: true}}
        - {name: username, in: query, schema: {type: string, maxLength: 12}}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Sessions, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/HotspotSession'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /sessions/{id}/disconnect:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Réseau]
      summary: 'Déconnecte un client (202 : exécuté par l''agent au prochain cycle)'
      responses:
        '202': {description: Commande en file, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/RouterCommand'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /network-events:
    get:
      tags: [Réseau]
      summary: 'Journal des événements réseau (lecture seule)'
      parameters:
        - {name: router_id, in: query, schema: {type: string, format: uuid}}
        - {name: severity, in: query, schema: {type: string, enum: [INFO, WARNING, ERROR]}}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Événements, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/NetworkEvent'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dashboard:
    get:
      tags: [Ventes]
      summary: 'Tableau de bord : réseau, clients connectés, tickets, recettes du jour (propres à l''agent s''il n''a pas `sales.view_all`), caisse'
      responses:
        '200': {description: 'Tableau de bord', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Dashboard'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /sales:
    get:
      tags: [Ventes]
      summary: 'Liste des ventes (un agent ne voit que les siennes)'
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [COMPLETED, VOIDED]}}
        - {name: agent_id, in: query, schema: {type: string, format: uuid}}
        - {name: site_id, in: query, schema: {type: string, format: uuid}}
        - {name: profile_id, in: query, schema: {type: string, format: uuid}}
        - {name: payment_method, in: query, schema: {type: string, enum: [CASH, MOBILE_MONEY, BANK, OTHER]}}
        - {name: currency, in: query, schema: {type: string, minLength: 3, maxLength: 3}}
        - {name: from, in: query, description: 'Jour local du tenant (inclus)', schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: 'Ventes', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Sale'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

    post:
      tags: [Ventes]
      summary: 'Vend un voucher du stock (voucher précis, ou un voucher AVAILABLE d''un profil sur un routeur). Rejouable via `client_ref` : le rejeu renvoie la vente d''origine (200).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method]
              properties:
                voucher_id: {type: string, format: uuid}
                router_id: {type: string, format: uuid, description: 'Requis sans voucher_id'}
                profile_id: {type: string, format: uuid, description: 'Requis sans voucher_id'}
                payment_method: {type: string, enum: [CASH, MOBILE_MONEY, BANK, OTHER]}
                provider_transaction_id: {type: string, maxLength: 100, description: 'Référence saisie par le vendeur, NON vérifiée auprès d''un opérateur'}
                client_ref: {type: string, maxLength: 64, description: 'Clé d''idempotence côté application'}
      responses:
        '201': {description: 'Vente créée (le code du voucher est renvoyé ici)', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Sale'}}}]}}}}
        '200': {description: 'Rejeu : vente déjà enregistrée', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Sale'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: '`no_voucher_available`, `voucher_not_sellable`, `cash_session_required`, `duplicate_reference`.', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}

  /sales/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Ventes]
      summary: 'Détail d''une vente'
      responses:
        '200': {description: 'Vente', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Sale'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /sales/{id}/void:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Ventes]
      summary: 'Annule une vente (idempotent). Espèces : écriture inverse en caisse. Révoque le voucher sauf `revoke_voucher=false`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 255}
                revoke_voucher: {type: boolean, default: true}
      responses:
        '200': {description: 'Vente annulée', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Sale'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: '`cash_session_required`.', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}

  /cash-registers:
    get:
      tags: [Caisse]
      summary: 'Liste des caisses'
      parameters:
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: 'Caisses', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/CashRegister'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

    post:
      tags: [Caisse]
      summary: 'Crée une caisse (fonction `cash` de la formule)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, currency]
              properties:
                name: {type: string, maxLength: 120}
                currency: {type: string, example: XOF}
                site_id: {type: string, format: uuid, nullable: true}
      responses:
        '201': {description: 'Caisse créée', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/CashRegister'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /cash-registers/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Caisse]
      summary: 'Modifie une caisse (la devise ne change pas)'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                name: {type: string, maxLength: 120}
                is_active: {type: boolean}
                site_id: {type: string, format: uuid, nullable: true}
      responses:
        '200': {description: 'Caisse modifiée', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/CashRegister'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /cash-sessions:
    get:
      tags: [Caisse]
      summary: 'Sessions de caisse (un caissier ne voit que les siennes)'
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [OPEN, CLOSED]}}
        - {name: cash_register_id, in: query, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: 'Sessions', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/CashSession'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

    post:
      tags: [Caisse]
      summary: 'Ouvre une session (une seule ouverte par caisse et par utilisateur)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cash_register_id, opening_balance]
              properties:
                cash_register_id: {type: string, format: uuid}
                opening_balance: {type: integer, minimum: 0}
                note: {type: string, maxLength: 255}
      responses:
        '201': {description: 'Session ouverte', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/CashSession'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: '`cash_session_already_open`, `cash_register_inactive`.', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}

  /cash-sessions/current:
    get:
      tags: [Caisse]
      summary: 'Ma session ouverte (`data` = null s''il n''y en a pas)'
      responses:
        '200': {description: 'Session ou null', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/CashSession'}], nullable: true}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /cash-sessions/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Caisse]
      summary: 'Détail d''une session'
      responses:
        '200': {description: 'Session', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/CashSession'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /cash-sessions/{id}/transactions:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Caisse]
      summary: 'Journal de la session (append-only)'
      parameters:
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: 'Écritures', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/CashTransaction'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

    post:
      tags: [Caisse]
      summary: 'Écriture manuelle : CASH_IN, EXPENSE, WITHDRAWAL (montant positif) ou ADJUSTMENT (signé). Sortie refusée si le solde deviendrait négatif.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount]
              properties:
                type: {type: string, enum: [CASH_IN, EXPENSE, WITHDRAWAL, ADJUSTMENT]}
                amount: {type: integer, description: 'Positif ; signé pour ADJUSTMENT ; jamais 0'}
                note: {type: string, maxLength: 255}
      responses:
        '201': {description: 'Écriture créée', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/CashTransaction'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: '`cash_session_closed`.', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}

  /cash-sessions/{id}/close:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Caisse]
      summary: 'Clôture : enregistre solde attendu, solde compté et écart'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counted_balance]
              properties:
                counted_balance: {type: integer, minimum: 0}
                note: {type: string, maxLength: 255}
      responses:
        '200': {description: 'Session clôturée', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/CashSession'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: '`cash_session_closed`.', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}

  /reports/sales:
    get:
      tags: [Rapports]
      summary: 'Rapport de ventes (ventes annulées exclues ; totaux par devise, jamais additionnés entre devises). Journalier : `basic_stats` ; hebdo/mensuel/annuel : `reports`.'
      parameters:
        - {name: period, in: query, required: true, schema: {type: string, enum: [daily, weekly, monthly, annual]}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: site_id, in: query, schema: {type: string, format: uuid}}
        - {name: agent_id, in: query, schema: {type: string, format: uuid}}
        - {name: profile_id, in: query, schema: {type: string, format: uuid}}
        - {name: currency, in: query, schema: {type: string, minLength: 3, maxLength: 3}}
        - {name: payment_method, in: query, schema: {type: string, enum: [CASH, MOBILE_MONEY, BANK, OTHER]}}
        - {name: group_by, in: query, schema: {type: string, enum: [none, site, agent, profile, payment_method], default: none}}
      responses:
        '200': {description: 'Rapport', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/SalesReport'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents:
    get:
      tags: [Agents]
      summary: 'Agents du tenant'
      parameters:
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: 'Agents', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/StaffMember'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

    post:
      tags: [Agents]
      summary: 'Crée un agent (limite `max_agents` de la formule)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: {type: string, maxLength: 120}
                email: {type: string, format: email, description: 'Requis sans phone'}
                phone: {type: string, description: 'Requis sans email'}
                password: {type: string, minLength: 8}
                locale: {type: string, enum: [fr, en, ar, ha]}
      responses:
        '201': {description: 'Agent créé', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/StaffMember'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Agents]
      summary: 'Détail d''un agent'
      responses:
        '200': {description: 'Agent', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/StaffMember'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

    put:
      tags: [Agents]
      summary: 'Modifie un agent. Désactiver ou changer le mot de passe coupe toutes ses sessions.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                name: {type: string}
                locale: {type: string, enum: [fr, en, ar, ha]}
                status: {type: string, enum: [ACTIVE, DISABLED]}
                password: {type: string, minLength: 8}
      responses:
        '200': {description: 'Agent modifié', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/StaffMember'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tickets/pdf:
    post:
      tags: [Documents]
      summary: 'Génère un PDF de tickets (permission tickets.export). Sélection : exactement une parmi batch_id, voucher_ids, router_id+profile_id. Seuls les vouchers AVAILABLE/VIP/SOLD synchronisés sont imprimables.'
      description: 'QR : fonctionnalité `qr` (PRO/BUSINESS). Par défaut inclus si la formule le permet ; `include_qr: true` sans la fonctionnalité répond 403 `feature_unavailable`. Le QR ne contient jamais de secret serveur. Erreurs : `no_printable_tickets`, `too_many_tickets` (meta.max, meta.selected), `pdf_engine_unavailable` (503).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: {type: string, enum: [a4, a5, individual, thermal]}
                thermal_width: {type: integer, enum: [58, 80], default: 58}
                locale: {type: string, enum: [fr, en, ar, ha]}
                include_qr: {type: boolean}
                batch_id: {type: string, format: uuid}
                voucher_ids: {type: array, maxItems: 500, items: {type: string, format: uuid}}
                router_id: {type: string, format: uuid}
                profile_id: {type: string, format: uuid}
      responses:
        '200':
          description: 'Fichier PDF (en-tête X-Tickets-Count)'
          content: {application/pdf: {schema: {type: string, format: binary}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: 'Moteur PDF indisponible (`pdf_engine_unavailable`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}

  /sales/{id}/receipt:
    get:
      tags: [Documents]
      summary: 'Reçu PDF d''une vente (code du ticket masqué). Les ventes annulées portent la mention ANNULÉ.'
      parameters:
        - $ref: '#/components/parameters/Id'
        - {name: format, in: query, schema: {type: string, enum: [a4, a5, thermal], default: thermal}}
        - {name: thermal_width, in: query, schema: {type: integer, enum: [58, 80]}}
        - {name: locale, in: query, schema: {type: string, enum: [fr, en, ar, ha]}}
      responses:
        '200': {description: 'Fichier PDF', content: {application/pdf: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /invoices/{id}/pdf:
    get:
      tags: [Documents]
      summary: 'Facture d''abonnement en PDF (propriétaire ; sans mentions fiscales)'
      parameters:
        - $ref: '#/components/parameters/Id'
        - {name: locale, in: query, schema: {type: string, enum: [fr, en, ar, ha]}}
      responses:
        '200': {description: 'Fichier PDF', content: {application/pdf: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /exports/sales.csv:
    get:
      tags: [Documents]
      summary: 'Export CSV des ventes (fonctionnalité `reports`, permission reports.view). Séparateur `;`, UTF-8 avec BOM, montants en unités mineures, cellules texte neutralisées contre l''injection de formules.'
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, description: 'Plage maximale 366 jours', schema: {type: string, format: date}}
        - {name: payment_method, in: query, schema: {type: string, enum: [CASH, MOBILE_MONEY, BANK, OTHER]}}
        - {name: include_voided, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: 'Fichier CSV', content: {text/csv: {schema: {type: string}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /branding:
    get:
      tags: [Documents]
      summary: 'Personnalisation des tickets et reçus du tenant'
      responses:
        '200': {description: 'Personnalisation', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Branding'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Documents]
      summary: 'Met à jour la personnalisation (propriétaire, abonnement actif)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string, maxLength: 80, nullable: true}
                phone: {type: string, maxLength: 30, nullable: true}
                slogan: {type: string, maxLength: 120, nullable: true}
                terms: {type: string, maxLength: 600, nullable: true}
                primary_color: {type: string, pattern: '^#[0-9A-Fa-f]{6}$', nullable: true}
                portal_url: {type: string, maxLength: 200, nullable: true, description: 'http(s) uniquement ; jamais appelée par le serveur'}
      responses:
        '200': {description: 'Personnalisation mise à jour', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Branding'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /branding/logo:
    get:
      tags: [Documents]
      summary: 'Logo (PNG ré-encodé)'
      responses:
        '200': {description: 'Image PNG', content: {image/png: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Documents]
      summary: 'Téléverse le logo : PNG/JPEG ≤ 512 Kio, 16–4000 px ; décodé puis ré-encodé en PNG ≤ 512 px (métadonnées et données ajoutées supprimées). Erreurs : logo_too_large, logo_invalid, logo_unsupported_type, logo_dimensions.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: {type: string, format: binary}
      responses:
        '200': {description: 'Personnalisation mise à jour', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Branding'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Documents]
      summary: 'Supprime le logo'
      responses:
        '200': {description: 'Personnalisation mise à jour', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Branding'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /currencies:
    get:
      tags: [International]
      summary: 'Devises actives (XOF, XAF, NGN, GHS, KES, USD, EUR, GBP au départ ; extensible) avec unité mineure et symbole'
      responses:
        '200': {description: 'Devises', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Currency'}}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /currencies/convert:
    get:
      tags: [International]
      summary: 'Équivalent INDICATIF d''un montant (fonction `multi_currency`). Ne modifie rien. Erreurs : rate_unavailable, currency_unavailable, rate_overflow.'
      parameters:
        - {name: amount, in: query, required: true, description: 'Unités mineures de la devise source', schema: {type: integer, minimum: 0, maximum: 999999999999}}
        - {name: from, in: query, required: true, schema: {type: string, minLength: 3, maxLength: 3}}
        - {name: to, in: query, required: true, schema: {type: string, minLength: 3, maxLength: 3}}
      responses:
        '200': {description: 'Conversion indicative', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Conversion'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /exchange-rates:
    get:
      tags: [International]
      summary: 'Taux du tenant + parités fixes (EUR/XOF/XAF), propriétaire, fonction `multi_currency`'
      responses:
        '200': {description: 'Taux', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ExchangeRate'}}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [International]
      summary: 'Crée ou remplace un taux manuel (sens unique : saisir aussi le sens inverse si besoin). Parités fixes non modifiables (`peg_rate_fixed`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, rate]
              properties:
                from: {type: string, minLength: 3, maxLength: 3}
                to: {type: string, minLength: 3, maxLength: 3}
                rate: {type: string, example: '610.5', description: 'Décimal positif, 7 chiffres entiers et 8 décimales maximum'}
      responses:
        '200': {description: 'Taux enregistré', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/ExchangeRate'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /exchange-rates/{id}:
    delete:
      tags: [International]
      summary: 'Supprime un taux manuel'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': {description: 'Supprimé', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /portal/orders/{token}:
    get:
      tags: [Portail]
      security: []
      summary: 'PUBLIC. Statut d''une commande par son jeton secret. Le code n''est renvoyé que livré (FULFILLED) et pendant PORTAL_CODE_REVEAL_HOURS.'
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]{32}$'}}
      responses:
        '200': {description: 'Statut', content: {application/json: {schema: {$ref: '#/components/schemas/PortalOrderStatus'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /portal/{slug}:
    get:
      tags: [Portail]
      security: []
      summary: 'PUBLIC. Offres du portail (profils STANDARD payants visibles). Avec `router`, indique la disponibilité du stock.'
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]{8,24}$'}}
        - {name: router, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'Portail et offres', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: 'Portail indisponible (`portal_unavailable` : abonnement inactif ou formule sans portail).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}

  /portal/{slug}/page:
    get:
      tags: [Portail]
      security: []
      summary: 'PUBLIC. Page HTML responsive du portail (CSP stricte, aucun secret). Paramètres de la redirection HotSpot : r (routeur), link-login-only, link-orig.'
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]{8,24}$'}}
        - {name: lang, in: query, schema: {type: string, enum: [fr, en, ar, ha]}}
      responses:
        '200': {description: 'Page HTML', content: {text/html: {schema: {type: string}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: 'Portail indisponible', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}

  /portal/{slug}/logo:
    get:
      tags: [Portail]
      security: []
      summary: 'PUBLIC. Logo du propriétaire (PNG ré-encodé)'
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]{8,24}$'}}
      responses:
        '200': {description: 'Image PNG', content: {image/png: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/NotFound'}

  /portal/{slug}/orders:
    post:
      tags: [Portail]
      security: []
      summary: 'PUBLIC. Crée une commande et lance le paiement (fournisseur mock uniquement tant qu''aucun adaptateur réel n''est branché). Le voucher n''est livré qu''après webhook signé et montant vérifié. Rejouable via client_ref. Erreurs : offer_unavailable, sold_out, provider_unavailable, portal_busy.'
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]{8,24}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, router_id]
              properties:
                profile_id: {type: string, format: uuid}
                router_id: {type: string, format: uuid}
                locale: {type: string, enum: [fr, en, ar, ha]}
                customer_phone: {type: string, pattern: '^\+?[0-9]{6,15}$'}
                client_ref: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$'}
                provider: {type: string, pattern: '^[a-z_]{2,32}$'}
      responses:
        '201': {description: 'Commande créée', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Plus de stock (`sold_out`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: 'Portail ou paiement indisponible', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}

  /portal-settings:
    get:
      tags: [Portail]
      summary: 'Réglages du portail (propriétaire)'
      responses:
        '200': {description: 'Réglages', content: {application/json: {schema: {$ref: '#/components/schemas/PortalSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Portail]
      summary: 'Active/désactive le portail (fonction `captive_portal`, PRO/BUSINESS) ou régénère son adresse publique (l''ancienne cesse de fonctionner)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                regenerate_slug: {type: boolean}
      responses:
        '200': {description: 'Réglages', content: {application/json: {schema: {$ref: '#/components/schemas/PortalSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /portal-orders:
    get:
      tags: [Portail]
      summary: 'Commandes d''achat direct (permission reports.view). Ni code ni jeton.'
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [PENDING_PAYMENT, FULFILLED, NEEDS_ATTENTION, FAILED, EXPIRED]}}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: 'Commandes', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /external-links:
    get:
      tags: [Portail]
      summary: 'Liens vers des services externes (ex. portail officiel Starlink)'
      responses:
        '200': {description: 'Liens', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Portail]
      summary: 'Ajoute un lien (https uniquement, sans identifiants ; aucun mot de passe n''est jamais stocké)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                kind: {type: string, enum: [STARLINK, OTHER]}
                name: {type: string, maxLength: 80}
                url: {type: string, maxLength: 300, example: 'https://www.starlink.com/account'}
                is_active: {type: boolean}
      responses:
        '201': {description: 'Lien créé', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /external-links/{id}:
    put:
      tags: [Portail]
      summary: 'Modifie un lien'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: {type: string, enum: [STARLINK, OTHER]}
                name: {type: string, maxLength: 80}
                url: {type: string, maxLength: 300}
                is_active: {type: boolean}
      responses:
        '200': {description: 'Lien modifié', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Portail]
      summary: 'Supprime un lien'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': {description: 'Supprimé', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token (15 min) obtenu via /auth/login ou /auth/register, renouvelé via /auth/refresh.
    agentToken:
      type: http
      scheme: bearer
      description: 'Jeton d''agent routeur (préfixe `wza_`), obtenu une seule fois via /agent/enroll. Limité à SON routeur.'

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PerPage:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}

  responses:
    Unauthorized:
      description: Authentification requise ou jeton invalide (`unauthenticated`).
      content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
    Forbidden:
      description: 'Accès refusé (`forbidden`, `tenant_required`, `tenant_suspended`, `account_disabled`).'
      content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
    NotFound:
      description: Ressource introuvable, ou appartenant à un autre tenant (`not_found`).
      content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
    ValidationError:
      description: Données invalides (`validation_failed`, `errors[].field`).
      content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
    RateLimited:
      description: Trop de requêtes (`rate_limited`).
      content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
    SubscriptionInactive:
      description: 'Abonnement inactif : écritures refusées, lectures et paiement restent possibles (`subscription_inactive`, `meta.status`).'
      content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}

  schemas:
    PortalSettings:
      type: object
      properties:
        enabled: {type: boolean}
        slug: {type: string, nullable: true, description: 'Identifiant public aléatoire (pas un secret d''authentification).'}
        page_url: {type: string, nullable: true}
        feature_available: {type: boolean}
    PortalOrderStatus:
      type: object
      properties:
        status: {type: string, enum: [PENDING_PAYMENT, FULFILLED, NEEDS_ATTENTION, FAILED, EXPIRED]}
        reference: {type: string, description: 'Huit premiers caractères de la commande, à communiquer au point de vente si NEEDS_ATTENTION.'}
        code: {type: string, nullable: true}
    Currency:
      type: object
      properties:
        code: {type: string, example: XOF}
        name: {type: string}
        minor_unit: {type: integer, example: 0}
        symbol: {type: string, nullable: true}
    Conversion:
      type: object
      properties:
        amount: {type: integer, description: 'Unités mineures de la devise cible'}
        currency: {type: string}
        rate: {type: string, example: '655.957'}
        source: {type: string, enum: [identity, peg, manual]}
