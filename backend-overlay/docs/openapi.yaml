        subscription:
          allOf: [{$ref: '#/components/schemas/Subscription'}]
          nullable: true
    TenantMe:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        country: {type: string}
        locale: {type: string}
        currency: {type: string}
        status: {type: string, enum: [ACTIVE, SUSPENDED]}
    Site:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
