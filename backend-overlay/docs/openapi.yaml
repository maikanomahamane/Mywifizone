openapi: 3.0.3
info:
  title: MY WIFIZONE API
  version: 0.9.0
  description: |
    API REST versionnée de MY WIFIZONE (Phases 1 à 7 : authentification, multi-tenant, RBAC, abonnements,
    facturation, paiements, Super Admin, réseau WiFi : routeurs, profils, vouchers, sessions, API de l'agent, ventes, caisse, rapports, agents, documents PDF/QR/CSV, personnalisation, devises et taux indicatifs).

    **Enveloppe** : toute réponse est `{ success, data, meta, errors }`. `errors[].code` est une clé stable que
    l'interface traduit (fr/en/ar/ha) ; `errors[].message` est technique.

    **Montants** : entiers en unités mineures de la devise (XOF n'a pas de décimales : 5000 = 5 000 FCFA). Jamais de décimaux.

    **Multi-tenant** : le tenant est celui de l'utilisateur authentifié. Aucun en-tête ni paramètre ne permet de le changer.
    Une ressource d'un autre tenant répond `404`.

    **Fournisseurs de paiement** : seul `mock` (fictif, dev/tests) est branché. Wave, Nita, Airtel Money et carte sont des
    adaptateurs non branchés : ils répondent `provider_unavailable` tant que la documentation officielle et les identifiants manquent.
  license:
    name: Propriétaire
servers:
  - url: /api/v1
security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Tenant
  - name: Sites
  - name: Abonnement
  - name: Paiements
  - name: Réseau
  - name: Tickets
  - name: Ventes
  - name: Caisse
  - name: Rapports
  - name: Agents
  - name: Documents
  - name: International
  - name: Portail
  - name: Agent
  - name: Admin
  - name: Exploitation

paths:
  /health:
    get:
      tags: [Auth]
      summary: État de l'API
      security: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}

  /health/ready:
    get:
      tags: [Exploitation]
      summary: 'Sonde de disponibilité (base de données, cache). Publique, sans détail ni version. 503 si un composant est en échec.'
      security: []
      responses:
        '200': {description: Prêt, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '503': {description: Dégradé, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}

  /internal/metrics:
    get:
      tags: [Exploitation]
      summary: 'Métriques Prometheus (agrégats sans identifiant). Jeton d''exploitation `METRICS_TOKEN` en Bearer ; 404 si le jeton n''est pas configuré.'
      security: []
      responses:
        '200': {description: 'Texte Prometheus 0.0.4', content: {text/plain: {schema: {type: string}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /plans:
    get:
      tags: [Abonnement]
      summary: Catalogue public des formules actives
      description: Prix et limites lus en base (modifiables par le Super Admin), jamais codés en dur.
      security: []
      responses:
        '200': {description: Formules, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Plan'}}}}]}}}}

  /auth/register:
    post:
      tags: [Auth]
      summary: Inscription (crée le tenant, le propriétaire et démarre l'essai gratuit)
      description: L'essai dure 14 jours par défaut (surchargeable par formule), prolongeable par un code TRIAL_EXTENSION.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, business_name, password]
              description: "`email` ou `phone` est obligatoire."
              properties:
                name: {type: string, maxLength: 120}
                business_name: {type: string, maxLength: 120}
                email: {type: string, format: email, nullable: true}
                phone: {type: string, nullable: true, example: '+22790123456', description: 'Normalisé (chiffres et + initial), 8 à 15 chiffres.'}
                password: {type: string, minLength: 8, maxLength: 128}
                locale: {type: string, enum: [fr, en, ar, ha]}
                device_name: {type: string, maxLength: 100}
                plan_code: {type: string, example: STARTER, description: 'Formule d''essai (défaut : STARTER).'}
                promo_code: {type: string, description: 'Code de type TRIAL_EXTENSION uniquement.'}
      responses:
        '201': {description: Compte créé, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AuthResult'}}}]}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion par e-mail ou téléphone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: {type: string, description: 'E-mail ou téléphone.'}
                password: {type: string}
                device_name: {type: string}
      responses:
        '200': {description: Connecté, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AuthResult'}}}]}}}}
        '401': {description: 'Identifiants invalides (`invalid_credentials`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '403': {description: 'Compte désactivé ou tenant suspendu (`account_disabled`, `tenant_suspended`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renouvelle les jetons (rotation)
      description: Le refresh token est à usage unique. Rejouer un jeton déjà consommé révoque toutes les sessions de l'utilisateur.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200': {description: Nouveaux jetons, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: object, properties: {tokens: {$ref: '#/components/schemas/Tokens'}}}}}]}}}}
        '401': {description: 'Jeton invalide, expiré ou déjà consommé (`invalid_refresh_token`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion (révoque l'access token et son refresh token)
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil, rôle, permissions et abonnement de l'utilisateur connecté
      responses:
        '200': {description: Profil, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: object, properties: {user: {$ref: '#/components/schemas/User'}}}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /tenants/me:
    get:
      tags: [Tenant]
      summary: Organisation de l'utilisateur connecté
      responses:
        '200': {description: Tenant, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/TenantMe'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [International]
      summary: 'Réglages régionaux du tenant (propriétaire, abonnement actif). Changer la devise par défaut ne modifie AUCUN prix ni vente existant.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 2, maxLength: 120}
                locale: {type: string, enum: [fr, en, ar, ha]}
                currency: {type: string, minLength: 3, maxLength: 3, description: 'Code d''une devise active'}
                country: {type: string, pattern: '^[A-Z]{2}$'}
                timezone: {type: string, example: Africa/Niamey}
      responses:
        '200': {description: 'OK', content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: object}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /sites:
    get:
      tags: [Sites]
      summary: Liste des sites du tenant (permission `sites.view`)
      parameters:
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Sites, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Site'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Sites]
      summary: Crée un site (permission `sites.manage`, abonnement actif, limite du plan)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteInput'}
      responses:
        '201': {description: Créé, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Site'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {description: 'Permission insuffisante ou limite du plan atteinte (`plan_limit_reached`, `meta.max`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}

  /sites/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Sites]
      summary: Détail d'un site
      responses:
        '200': {description: Site, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Site'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Sites]
      summary: Modifie un site (abonnement actif requis)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteInput'}
      responses:
        '200': {description: Site modifié, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Site'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Sites]
      summary: Supprime un site (abonnement actif requis)
      responses:
        '200': {description: Supprimé, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /subscription:
    get:
      tags: [Abonnement]
      summary: Abonnement courant, formule et usage (permission `subscription.view`)
      responses:
        '200': {description: Abonnement, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: object, properties: {subscription: {$ref: '#/components/schemas/Subscription'}, plan: {$ref: '#/components/schemas/Plan'}, usage: {type: object, properties: {sites: {type: integer}}}}}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /subscription/providers:
    get:
      tags: [Abonnement]
      summary: Moyens de paiement réellement utilisables (activés ET branchés)
      parameters:
        - {name: currency, in: query, schema: {type: string, default: XOF, minLength: 3, maxLength: 3}}
      responses:
        '200': {description: Fournisseurs utilisables, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {type: object, properties: {code: {type: string}, name: {type: string}}}}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /subscription/checkout:
    post:
      tags: [Abonnement]
      summary: Crée une facture et lance le paiement (permission `subscription.manage`)
      description: |
        Idempotent via l'en-tête `Idempotency-Key` : rejouer la même requête renvoie la même transaction (`200`) sans
        créer de nouvelle facture. La même clé avec une autre demande répond `409 idempotency_key_reused`.
        Une facture entièrement remise par une promotion est soldée immédiatement (`payment: null`).
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 100, pattern: '^[A-Za-z0-9_\-:.]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_code, billing_cycle, provider]
              properties:
                plan_code: {type: string, example: PRO}
                billing_cycle: {type: string, enum: [MONTHLY, YEARLY]}
                provider: {type: string, example: mock}
                promo_code: {type: string, description: 'Code de remise (PERCENTAGE ou FIXED).'}
                phone: {type: string, nullable: true, description: 'Numéro Mobile Money du payeur.'}
      responses:
        '200': {description: 'Rejeu idempotent', content: {application/json: {schema: {$ref: '#/components/schemas/CheckoutResponse'}}}}
        '201': {description: Facture et paiement créés, content: {application/json: {schema: {$ref: '#/components/schemas/CheckoutResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: 'Conflit (`idempotency_key_reused`, `idempotency_conflict`, `no_subscription`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {description: 'Données invalides, périodicité indisponible (`cycle_unavailable`) ou fournisseur indisponible (`provider_unavailable`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '503': {description: 'Fournisseur de paiement indisponible.', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}

  /subscription/cancel:
    post:
      tags: [Abonnement]
      summary: Résilie (immédiat pendant l'essai ou en attente ; à l'échéance si actif)
      responses:
        '200': {description: Abonnement mis à jour, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Subscription'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: 'Non résiliable (`subscription_not_cancellable`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}

  /invoices:
    get:
      tags: [Abonnement]
      summary: Historique des factures et reçus (permission `subscription.view`)
      parameters:
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Factures, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Invoice'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /invoices/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Abonnement]
      summary: Détail d'une facture
      responses:
        '200': {description: Facture, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Invoice'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /payments/webhooks/{provider}:
    post:
      tags: [Paiements]
      summary: Webhook d'un fournisseur de paiement
      description: |
        Non authentifié : protégé par la signature propre à chaque fournisseur, vérifiée sur le corps BRUT.
        Idempotent par `(provider, event_id)`. Un succès dont le montant ou la devise diffère de la transaction
        n'active jamais rien (`outcome: rejected`).

        **Fournisseur `mock` (fictif)** : en-têtes `X-Mock-Timestamp` et `X-Mock-Signature`
        (`sha256=` + HMAC-SHA256 de `{timestamp}.{corps}`), tolérance d'horloge 300 s.
      security: []
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, pattern: '^[a-z_]{2,32}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id: {type: string}
                type: {type: string, enum: [payment.succeeded, payment.failed]}
                reference: {type: string}
                amount: {type: integer, minimum: 0}
                currency: {type: string}
                reason: {type: string}
      responses:
        '200':
          description: Webhook pris en compte
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          outcome: {type: string, enum: [processed, duplicate, rejected, ignored]}
        '401': {description: 'Signature invalide ou horodatage périmé (`invalid_signature`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '404': {description: 'Fournisseur inconnu ou non branché (`provider_unavailable`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}

  /admin/overview:
    get:
      tags: [Admin]
      summary: Tableau de bord plateforme (permission `admin.platform.view`)
      responses:
        '200': {description: Indicateurs, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Overview'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/plans:
    get:
      tags: [Admin]
      summary: Toutes les formules, y compris inactives (permission `admin.plans.manage`)
      responses:
        '200': {description: Formules, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/PlanAdmin'}}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/plans/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Admin]
      summary: Modifie prix, limites, fonctionnalités, essai et grâce
      description: Un changement ne touche que les futures factures. `limits` est fusionné clé par clé ; `null` = illimité.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                monthly_price: {type: integer, minimum: 0}
                yearly_price: {type: integer, minimum: 0, nullable: true, description: 'null = pas de formule annuelle.'}
                currency: {type: string, example: XOF}
                trial_days: {type: integer, minimum: 0, maximum: 365, nullable: true, description: 'null = valeur par défaut (14 jours).'}
                grace_days: {type: integer, minimum: 0, maximum: 60, nullable: true}
                limits: {$ref: '#/components/schemas/PlanLimits'}
                features: {type: array, items: {type: string}}
                is_active: {type: boolean}
      responses:
        '200': {description: Formule modifiée, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/PlanAdmin'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /admin/promotions:
    get:
      tags: [Admin]
      summary: Promotions
      responses:
        '200': {description: Promotions, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Promotion'}}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin]
      summary: Crée une promotion (PERCENTAGE, FIXED ou TRIAL_EXTENSION)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type, value]
              properties:
                code: {type: string, description: 'Normalisé en majuscules.'}
                type: {type: string, enum: [PERCENTAGE, FIXED, TRIAL_EXTENSION]}
                value: {type: integer, minimum: 1, description: '% (≤ 100), unités mineures ou jours selon le type.'}
                currency: {type: string, nullable: true, description: 'Obligatoire pour FIXED.'}
                plan_code: {type: string, nullable: true}
                starts_at: {type: string, format: date-time, nullable: true}
                ends_at: {type: string, format: date-time, nullable: true}
                max_redemptions: {type: integer, minimum: 1, nullable: true}
                is_active: {type: boolean}
      responses:
        '201': {description: Créée, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Promotion'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /admin/promotions/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Admin]
      summary: Modifie une promotion (le type et le code sont immuables)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: {type: integer, minimum: 1}
                plan_code: {type: string, nullable: true}
                starts_at: {type: string, format: date-time, nullable: true}
                ends_at: {type: string, format: date-time, nullable: true}
                max_redemptions: {type: integer, minimum: 1, nullable: true}
                is_active: {type: boolean}
      responses:
        '200': {description: Modifiée, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Promotion'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /admin/payment-providers:
    get:
      tags: [Admin]
      summary: Fournisseurs de paiement (permission `admin.providers.manage`)
      responses:
        '200': {description: Fournisseurs, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/PaymentProvider'}}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/payment-providers/{code}:
    parameters:
      - {name: code, in: path, required: true, schema: {type: string, pattern: '^[a-z_]{2,32}$'}}
    put:
      tags: [Admin]
      summary: Active/désactive un fournisseur et règle pays et devises
      description: Activer un fournisseur ne le rend pas utilisable tant que `credentials_configured` est faux.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                countries: {type: array, nullable: true, items: {type: string, minLength: 2, maxLength: 2}}
                currencies: {type: array, nullable: true, items: {type: string, minLength: 3, maxLength: 3}}
      responses:
        '200': {description: Fournisseur modifié, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/PaymentProvider'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /admin/tenants:
    get:
      tags: [Admin]
      summary: Liste des tenants (permission `admin.tenants.manage`)
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [ACTIVE, SUSPENDED]}}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Tenants, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/AdminTenant'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/tenants/{id}/suspend:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Admin]
      summary: Suspend un tenant (idempotent)
      description: Bloque connexion et jetons existants ; l'abonnement passe à SUSPENDED.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 255}
      responses:
        '200': {description: Tenant suspendu, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AdminTenant'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/tenants/{id}/reactivate:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Admin]
      summary: Réactive un tenant (idempotent)
      description: Le statut de l'abonnement est recalculé d'après ses dates ; le temps passé suspendu compte (hypothèse à valider).
      responses:
        '200': {description: Tenant réactivé, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AdminTenant'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/payments:
    get:
      tags: [Admin]
      summary: Paiements de tous les tenants (lecture seule, permission `admin.payments.view`)
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: provider, in: query, schema: {type: string}}
        - {name: tenant_id, in: query, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Paiements, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/AdminPayment'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Journal d'audit (append-only, permission `admin.audit.view`)
      parameters:
        - {name: action, in: query, schema: {type: string}}
        - {name: tenant_id, in: query, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Entrées d'audit, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /agent/enroll:
    post:
      tags: [Agent]
      summary: 'Échange le code d''enrôlement contre le jeton de l''agent (usage unique, non authentifié)'
      description: 'Appelé par l''agent installé près du routeur. Code inconnu, expiré ou déjà utilisé : `invalid_enrollment_code` (422). Limité à 10/min par IP.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentEnrollInput'}
      responses:
        '201': {description: Jeton émis (affiché une seule fois), content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AgentEnrollment'}}}]}}}}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agent/heartbeat:
    post:
      tags: [Agent]
      summary: 'Signal de vie, santé et sessions actives (jeton d''agent)'
      security: [{agentToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentHeartbeat'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agent/poll:
    post:
      tags: [Agent]
      summary: 'Remet à l''agent les commandes à exécuter (bail de 60 s)'
      security: [{agentToken: []}]
      responses:
        '200': {description: Commandes, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/AgentCommand'}}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /agent/commands/{id}/result:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Agent]
      summary: 'Résultat d''une commande (idempotent)'
      description: 'Contrat par type : CREATE_VOUCHER `{created: [code], failed: [{code, error}]}` ; FETCH_SESSIONS `{sessions, finished_codes}` ; FETCH_HEALTH `{health}`.'
      security: [{agentToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCommandResult'}
      responses:
        '200': {description: Résultat pris en compte, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/AgentResultAck'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /routers:
    get:
      tags: [Réseau]
      summary: 'Liste des routeurs (permission `routers.view`)'
      parameters:
        - {name: site_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [PENDING, ONLINE, OFFLINE]}}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Routeurs, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Router'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Réseau]
      summary: 'Crée un routeur et son code d''enrôlement (`routers.manage`, abonnement actif, limite `max_routers`)'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RouterInput'}
      responses:
        '201': {description: Créé (le code d'enrôlement n'est affiché qu'ici), content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/RouterCreated'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /routers/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Réseau]
      summary: 'Détail d''un routeur'
      responses:
        '200': {description: Routeur, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Router'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Réseau]
      summary: 'Modifie un routeur'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RouterUpdate'}
      responses:
        '200': {description: Routeur, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Router'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Réseau]
      summary: 'Supprime un routeur'
      responses:
        '200': {description: Supprimé, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /routers/{id}/test:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Réseau]
      summary: 'Teste la connexion directe avec le compte dédié enregistré (ne modifie rien sur le routeur)'
      responses:
        '200': {description: Connexion OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Router'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Ce routeur n''est pas en connexion directe (`not_direct_router`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {description: 'Échec de connexion : `router_auth_failed`, `router_unreachable`, `router_timeout`, `router_tls_failed`, `router_target_forbidden`, `router_rights_insufficient`, `router_api_error`.', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '429': {description: 'Trop d''essais (10 par minute et par utilisateur).'}

  /routers/{id}/reconnect:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Réseau]
      summary: 'Reconnecte un routeur en connexion directe avec de nouveaux identifiants admin (le compte dédié est recréé)'
      description: 'Les identifiants admin ne servent qu''à cet appel : ils ne sont ni stockés ni journalisés.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                host: {type: string, description: 'Défaut : adresse enregistrée.'}
                port: {type: integer, minimum: 1, maximum: 65535}
                username: {type: string, maxLength: 64}
                password: {type: string, maxLength: 255, format: password, writeOnly: true}
                verify_tls: {type: boolean}
      responses:
        '200': {description: Routeur reconnecté, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/Router'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Ce routeur n''est pas en connexion directe (`not_direct_router`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        '422': {description: 'Échec de connexion (mêmes codes que `/routers/{id}/test`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}

  /routers/{id}/rotate-agent-token:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Réseau]
      summary: 'Invalide le jeton de l''agent et émet un nouveau code d''enrôlement'
      responses:
        '200': {description: Nouveau code, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/RouterCreated'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /routers/{id}/sync:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Réseau]
      summary: 'Resynchronise profils, santé, sessions et vouchers en échec (mise en file)'
      responses:
        '202': {description: Commandes mises en file, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {$ref: '#/components/schemas/SyncResult'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/SubscriptionInactive'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Conflit (`router_not_enrolled`, `profile_in_use`, `voucher_not_revocable`, `connector_unavailable`).', content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}

  /routers/{id}/commands:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Réseau]
      summary: 'File de commandes du routeur (diagnostic)'
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [PENDING, LEASED, SUCCEEDED, FAILED]}}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Commandes, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/RouterCommand'}}, meta: {$ref: '#/components/schemas/Pagination'}}}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

