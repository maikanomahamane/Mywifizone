        reference: {type: string, nullable: true}
        amount: {type: integer}
        currency: {type: string}
        instructions: {type: object, nullable: true, additionalProperties: true}
        failure_reason: {type: string, nullable: true}
    CheckoutResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                invoice: {$ref: '#/components/schemas/Invoice'}
                payment:
                  allOf: [{$ref: '#/components/schemas/Payment'}]
                  nullable: true
    Promotion:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        type: {type: string, enum: [PERCENTAGE, FIXED, TRIAL_EXTENSION]}
        value: {type: integer}
        currency: {type: string, nullable: true}
        plan_code: {type: string, nullable: true}
        starts_at: {type: string, format: date-time, nullable: true}
        ends_at: {type: string, format: date-time, nullable: true}
        max_redemptions: {type: integer, nullable: true}
        redemptions_count: {type: integer}
        is_active: {type: boolean}
    PaymentProvider:
      type: object
      properties:
        code: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        countries: {type: array, nullable: true, items: {type: string}}
        currencies: {type: array, nullable: true, items: {type: string}}
        credentials_configured: {type: boolean, description: 'Faux pour un adaptateur non branché.'}
        required_env: {type: array, items: {type: string}, description: 'Variables provisoires, à confirmer d''après la documentation officielle.'}
    AdminTenant:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        country: {type: string}
        status: {type: string, enum: [ACTIVE, SUSPENDED]}
        created_at: {type: string, format: date-time}
        subscription:
          allOf: [{$ref: '#/components/schemas/Subscription'}]
          nullable: true
    AdminPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          properties:
            tenant_id: {type: string, format: uuid}
            invoice_number: {type: string, nullable: true}
            created_at: {type: string, format: date-time}
    AuditLog:
      type: object
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid, nullable: true}
        user_id: {type: string, format: uuid, nullable: true}
        action: {type: string, example: subscription.activated}
        subject_type: {type: string, nullable: true}
        subject_id: {type: string, nullable: true}
        ip: {type: string, nullable: true}
        request_id: {type: string, nullable: true}
        metadata: {type: object, nullable: true, additionalProperties: true}
        created_at: {type: string, format: date-time}
    Overview:
      type: object
      properties:
        tenants:
          type: object
          properties:
            ACTIVE: {type: integer}
            SUSPENDED: {type: integer}
        users: {type: integer, description: 'Utilisateurs rattachés à un tenant.'}
        subscriptions:
          type: object
          description: 'Nombre d''abonnements par statut.'
          additionalProperties: {type: integer}
        revenue:
          type: array
          description: 'CA SaaS encaissé (factures payées), une ligne par devise.'
          items:
            type: object
            properties:
              currency: {type: string}
              invoices: {type: integer}
              total: {type: integer}
        payments_in_flight: {type: integer}
        health:
          type: object
          properties:
            database: {type: boolean}
            cache: {type: boolean}

    AgentEnrollInput:
      type: object
      required: [enrollment_code]
      properties:
        enrollment_code: {type: string, maxLength: 40, example: WZ-ABCDE-FGHJK-MNPQR-STUVW}
        agent_version: {type: string, maxLength: 40}
        routeros_version: {type: string, maxLength: 40}
        model: {type: string, maxLength: 80}
    AgentEnrollment:
      type: object
      properties:
        router_id: {type: string, format: uuid}
        agent_token: {type: string, description: 'Préfixe `wza_`. Affiché une seule fois ; à conserver sur le routeur uniquement.'}
        hotspot_server: {type: string, nullable: true}
        poll_interval: {type: integer, example: 10}
        heartbeat_interval: {type: integer, example: 30}
    AgentHeartbeat:
      type: object
      description: Tout est optionnel. Les clés inconnues sont ignorées.
      properties:
        health:
          type: object
          properties:
            board_name: {type: string}
            version: {type: string}
            agent_version: {type: string}
            cpu_load: {type: integer, minimum: 0, maximum: 100}
            free_memory: {type: integer}
            total_memory: {type: integer}
            uptime_seconds: {type: integer}
        sessions: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/AgentSession'}}
        finished_codes: {type: array, maxItems: 500, items: {type: string}, description: 'Codes dont le quota est épuisé côté routeur.'}
    AgentSession:
      type: object
      required: [id, username]
      properties:
        id: {type: string, description: Identifiant RouterOS de la session, example: '*1A'}
        username: {type: string}
        address: {type: string, format: ip}
        mac: {type: string, example: 'AA:BB:CC:DD:EE:FF'}
        uptime_seconds: {type: integer}
        bytes_in: {type: integer}
        bytes_out: {type: integer}
    AgentCommand:
      type: object
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [CREATE_VOUCHER, DISABLE_VOUCHER, REVOKE_VOUCHER, FETCH_SESSIONS, DISCONNECT_USER, FETCH_HEALTH, SYNC_PROFILES]}
        payload: {type: object, description: 'Données (jamais du script) : l''agent doit les traiter comme des valeurs, en corps JSON vers RouterOS.'}
        attempt: {type: integer}
    AgentCommandResult:
      type: object
      required: [success]
      properties:
        success: {type: boolean}
        result: {type: object, nullable: true}
        error: {type: string, maxLength: 1000, nullable: true}
        retryable: {type: boolean, default: true}
    AgentResultAck:
      type: object
      properties:
        status: {type: string, enum: [PENDING, LEASED, SUCCEEDED, FAILED]}
        duplicate: {type: boolean}
    Router:
      type: object
      properties:
        id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        name: {type: string}
        model: {type: string, nullable: true}
        routeros_version: {type: string, nullable: true}
        connection_mode: {type: string, enum: [AGENT, REST], description: 'AGENT : agent sortant (code d''enrôlement). REST : connexion directe, le serveur appelle l''API REST du routeur avec un compte dédié.'}
        status: {type: string, enum: [PENDING, ONLINE, OFFLINE]}
        hotspot_server: {type: string, nullable: true}
        agent_enrolled: {type: boolean}
        rest_host: {type: string, nullable: true, description: 'Mode REST uniquement. Jamais de mot de passe dans l''API.'}
        rest_port: {type: integer, nullable: true}
        rest_verify_tls: {type: boolean, nullable: true}
        rest_error: {type: string, nullable: true, description: 'Dernier échec de connexion au routeur (diagnostic).'}
        enrollment_pending: {type: boolean}
        last_seen_at: {type: string, format: date-time, nullable: true}
        health: {type: object, nullable: true}
        clients_count: {type: integer}
        created_at: {type: string, format: date-time}
