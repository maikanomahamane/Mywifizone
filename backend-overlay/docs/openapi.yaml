    SyncResult:
      type: object
      properties:
        commands_queued: {type: integer}
        vouchers_resent: {type: integer}
    RouterCommand:
      type: object
      properties:
        id: {type: string, format: uuid}
        router_id: {type: string, format: uuid}
        type: {type: string}
        status: {type: string, enum: [PENDING, LEASED, SUCCEEDED, FAILED]}
        attempts: {type: integer}
        max_attempts: {type: integer}
        executed_at: {type: string, format: date-time, nullable: true}
        error: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    AccessPoint:
      type: object
      properties:
        id: {type: string, format: uuid}
        router_id: {type: string, format: uuid}
        name: {type: string}
        model: {type: string, nullable: true}
        location: {type: string, nullable: true}
