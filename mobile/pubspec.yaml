name: mywifizone
description: MY WIFIZONE - Manage • Sell • Connect
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"   # CardThemeData, génération l10n hors package synthétique

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^18.1.1
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  # Phase 5 (versions à confirmer au premier `flutter pub get`)
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  printing: ^5.13.4
  # Phase 7 : ouverture des liens externes (Starlink...) dans le navigateur
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
