name: E2E (pile Docker complète)

# Lance la vraie pile (nginx + php-fpm + worker + PostgreSQL + Redis) et déroule scripts/e2e-smoke.sh dessus.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend-overlay/**", "docker/**", "docker-compose.yml", "scripts/**", ".github/workflows/e2e.yml"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installation (make setup)
        run: make setup
      - name: Migrations et données de base
        run: |
          set +e
          make migrate > migrate-out.txt 2>&1
          code=$?
          tail -n 40 migrate-out.txt
          if [ $code -ne 0 ]; then
            sed -E 's/\x1b\[[0-9;]*m//g' migrate-out.txt | grep -v -E '^#[0-9]+ ' | tail -n 30 | cut -c1-300 | awk '{printf "%s%%0A", $0} END{print ""}' | while IFS= read -r l; do echo "::error::MIGRATE $l"; done
          fi
          exit $code
      - name: Démarrage de la pile
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8080/api/v1/health/ready >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker compose logs --tail=80
          echo "la pile n'est pas prête" >&2; exit 1
      - name: Parcours de fumée
        run: bash scripts/e2e-smoke.sh http://localhost:8080
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail=200
