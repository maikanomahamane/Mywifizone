name: Backend tests

on:
  workflow_dispatch:
  push:
    paths: ["backend-overlay/**", "scripts/**", "docker/**", "docker-compose*.yml", ".github/workflows/backend-tests.yml"]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd
          tools: composer
      - name: Squelette Laravel 12 + overlay
        run: |
          composer create-project laravel/laravel:^12.0 backend --no-interaction --prefer-dist
          cd backend
          composer require laravel/sanctum --no-interaction
          composer require mpdf/mpdf mpdf/qrcode --no-interaction
          rm -f database/migrations/0001_01_01_000000_create_users_table.php database/migrations/*_create_personal_access_tokens_table.php
          cp -a ../backend-overlay/. .
          cp .env.example .env
          php artisan key:generate --force
          composer dump-autoload
      - name: Tests (SQLite en mémoire)
        working-directory: backend
        run: |
          set +e
          php artisan test > ../phpunit-out.txt 2>&1
          code=$?
          tail -n 60 ../phpunit-out.txt
          [ $code -ne 0 ] && bash ../scripts/ci-annotate.sh ../phpunit-out.txt 40
          exit $code
      - name: PDF d'exemple (contrôle visuel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-pdfs
          path: backend/storage/app/sample-pdfs
          if-no-files-found: ignore
      - name: Script du portail captif (Node)
        run: node --test backend-overlay/tests/js/portal.test.js
      - name: Logique de domaine pure
        run: php scripts/smoke-domain.php
      - name: Logique JavaScript du portail
        run: node scripts/portal-js-test.js
      - name: Scripts shell (syntaxe + secrets)
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          # Le scan des secrets du dépôt est fait par le workflow « Sécurité » (ici, backend/.env généré le fausserait).

  # Mêmes tests sur PostgreSQL 16 : la suite principale tourne sur SQLite, qui ne voit pas les écarts de dialecte
  # (verrous FOR UPDATE SKIP LOCKED, contraintes uniques, types uuid, index partiels).
  phpunit-pgsql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mywifizone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, bcmath, gd
          tools: composer
      - name: Squelette Laravel 12 + overlay
        run: |
          composer create-project laravel/laravel:^12.0 backend --no-interaction --prefer-dist
          cd backend
          composer require laravel/sanctum mpdf/mpdf mpdf/qrcode --no-interaction
          rm -f database/migrations/0001_01_01_000000_create_users_table.php database/migrations/*_create_personal_access_tokens_table.php
          cp -a ../backend-overlay/. .
          cp .env.example .env
          php artisan key:generate --force
          composer dump-autoload
      - name: Tests (PostgreSQL)
        working-directory: backend
        run: |
          set +e
          php vendor/bin/phpunit --configuration=phpunit.pgsql.xml > ../phpunit-out.txt 2>&1
          code=$?
          tail -n 60 ../phpunit-out.txt
          if [ $code -ne 0 ]; then echo "::error::EXITCODE $code"; sed -E 's/\x1b\[[0-9;]*m//g' ../phpunit-out.txt | grep -n -i -B1 -A6 -E 'warn|notice|deprecat|risky|incomplete' | grep -v -E '^[0-9]+[-:]#[0-9]+ ' | head -40 | cut -c1-220 | awk '{printf "%s%%0A", $0} END{print ""}' | while IFS= read -r l; do echo "::error::NOTE $l"; done; fi
          exit $code
      - name: Audit des dépendances
        working-directory: backend
        run: composer audit --no-interaction
